services:
  # Web Service: Render requiere un proceso escuchando en 0.0.0.0:$PORT
  # El bot abre un único HTTP (dashboard + /health) en ese puerto al arrancar.
  - type: web
    name: music-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    # Opcional: persistir state.json / cookies entre deploys
    # disk:
    #   name: data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      # Opcional: cookies de YouTube para acceso a contenidos restringidos/edad
      - key: YT_COOKIE
        sync: false
      - key: WEB_PASSWORD
        sync: false
      # Debug opcional
      - key: DEBUG_AUDIO
        value: "0"
      - key: FAST_START
        value: "1"
      - key: FAST_START_MS
        value: "2000"
      - key: YT_FORCE_YTDLP
        value: "1"
      - key: YT_DLP_PATH
        value: "/usr/local/bin/yt-dlp"
      # Nota: NO definir PORT ni WEB_PORT aquí — Render inyecta PORT automáticamente.
